<meta charset="utf-8">
<title>Visite guidée d'Impro Match</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&display=swap">
<style>
/* Mise en page : une colonne « coach » (une consigne à la fois) et une copie du board sur laquelle on agit.
   Un seul aspect, sombre, comme l'app. La copie du board suit l'app réelle (captures du 11 novembre 2026) :
   quand le board change, cette copie doit suivre. */
:root {
  color-scheme: dark;
  --bg: #0E1116; --panel: #151922; --line: #3A4150; --fg: #F4F5F7; --soft: #C9CED8;
  --accent: #FFD479; --ink: #0E1116; --live: #FF5A5F; --ok: #3DDC84; --mac: #0A817C;
  --win: #1B1B1F; --side: #28272E; --ctl: rgba(255,255,255,.1); --hair: rgba(255,255,255,.09); --dim: #9A9BA3;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 var(--ui);
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
kbd { font: 600 12px var(--ui); background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 7px; white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Progression */
.vg-prog { display: flex; gap: 6px; padding-block: 12px 10px; align-items: flex-end; }
.vg-prog button { flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; }
.vg-prog span { display: block; font: 600 13px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--soft); opacity: .55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; }
.vg-prog i { display: block; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.vg-prog i b { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s cubic-bezier(.2,.8,.2,1); }
.vg-prog .cur span { opacity: 1; color: var(--accent); }
.vg-prog .past span { opacity: .9; }

.vg-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(270px, 330px) minmax(0, 1fr); gap: 20px; padding-bottom: 14px; }

/* Coach */
.vg-coach { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding-top: 8px; min-height: 0; }
#vg-copy { position: relative; flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 4px; scrollbar-width: thin; }
.vg-eye { margin: 0; font: 600 15px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.vg-coach h1 { margin: 0; font: 800 36px/1 var(--display); text-transform: uppercase; text-wrap: balance; }
.vg-coach p { margin: 0; max-width: 34em; }
.vg-keys { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; color: var(--soft); font-size: 13px; }
.vg-ok { display: flex; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; animation: vg-up .45s cubic-bezier(.2,.8,.2,1) both; }
.vg-ok::before { content: "✓"; color: var(--ok); font-weight: 700; }
.vg-logo svg { width: 96px; height: 96px; display: block; filter: drop-shadow(0 6px 16px rgba(0,0,0,.4)); }
.vg-ok > *, .vg-x > * { min-width: 0; }
.vg-x ul, .vg-ok ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; } .vg-x li::marker { color: var(--accent); } .vg-ok li::marker { color: var(--ok); }
.vg-anim > * { animation: vg-up .45s cubic-bezier(.2,.8,.2,1) both; }
.vg-anim > :nth-child(2) { animation-delay: .04s; } .vg-anim > :nth-child(3) { animation-delay: .08s; } .vg-anim > :nth-child(4) { animation-delay: .12s; }
@keyframes vg-up { from { opacity: 0; transform: translateY(10px); } }
.vg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.vg-chips button, .vg-btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; }
.vg-short { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; margin: 0; }
.vg-short dt { justify-self: start; } .vg-short dd { margin: 0; color: var(--soft); }
.vg-nav { display: flex; gap: 8px; flex: none; padding: 8px 0 2px; flex-wrap: wrap; position: relative; z-index: 2; }
.vg-nav button { white-space: nowrap; border-radius: 10px; border: 1px solid var(--line); background: transparent; padding: 9px 14px; font-weight: 600; }
.vg-nav .go { background: var(--accent); color: var(--ink); border-color: var(--accent); flex: 1; }
.vg-nav .go:disabled { background: transparent; color: var(--soft); border-color: var(--line); opacity: .5; cursor: default; }
.vg-nav .go.pulse { animation: vg-pulse 1.2s ease-in-out infinite; }
@keyframes vg-pulse { 50% { box-shadow: 0 0 0 6px rgba(255,212,121,.25); } }

/* Liste des étapes du chapitre : l'étape en cours est dépliée */
.vg-steps { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.vg-steps > li { border: 1px solid transparent; border-radius: 12px; }
.vg-steps > li > button { display: flex; gap: 10px; align-items: center; width: 100%; background: none; border: 0; padding: 6px 8px; border-radius: 10px; text-align: left; color: var(--soft); font-size: 14.5px; }
.vg-steps > li > button:hover { background: var(--panel); }
.vg-steps .n { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 700; box-sizing: border-box; }
.vg-steps .done .n { background: var(--ok); border-color: var(--ok); color: var(--ink); }
.vg-steps .todo > button { opacity: .6; }
.vg-steps .cur { background: var(--panel); border-color: var(--line); }
.vg-steps .cur > button { color: var(--fg); font-weight: 700; } .vg-steps .cur > button:hover { background: none; }
.vg-steps .cur .n { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.vg-body { padding: 0 12px 12px 40px; display: flex; flex-direction: column; gap: 10px; animation: vg-up .4s cubic-bezier(.2,.8,.2,1) both; }
.vg-hint { display: flex; gap: 8px; align-items: flex-start; color: var(--accent); font-size: 13.5px; margin: 0; } .vg-hint svg { margin-top: 3px; }
.vg-hint.ok { color: var(--ok); }
.vg-nav .back { flex: none; }

/* Scène : la copie du board, à taille fixe, mise à l'échelle par la « caméra » */
.vg-view { position: relative; overflow: hidden; min-width: 0; border-radius: 14px; background: #07090C; border: 1px solid var(--hair); }
.vg-stage { position: absolute; left: 0; top: 0; width: 1240px; height: 880px; transform-origin: 0 0; transition: transform .7s cubic-bezier(.2,.8,.2,1); font: 13px/1.3 var(--ui); color: #ECECEE; }
.vg-stage svg { flex: none; display: block; }
.vg-scroll { overflow-y: auto; scrollbar-width: none; } .vg-scroll::-webkit-scrollbar { display: none; }
.vg-win { position: absolute; inset: 0; background: var(--win); display: flex; border-radius: 12px; overflow: hidden; }
.lights { display: flex; gap: 8px; align-items: center; } .lights i { width: 12px; height: 12px; border-radius: 50%; }
.lights i:nth-child(1) { background: #FF5F57; } .lights i:nth-child(2) { background: #FEBC2E; } .lights i:nth-child(3) { background: #28C840; }
.glass { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.07); border-radius: 99px; height: 34px; min-width: 34px; padding: 0 9px; display: inline-flex; align-items: center; justify-content: center; gap: 3px; color: #E4E4E8; }
.glass:hover { background: rgba(255,255,255,.14); }
/* Déroulé : panneau flottant, sur toute la hauteur */
.vg-side { width: 220px; flex: none; margin: 6px; border-radius: 14px; background: var(--side); border: 1px solid var(--hair); display: flex; flex-direction: column; }
.vg-side .top { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 14px; flex: none; }
.vg-side h4 { margin: 2px 14px 4px; font-size: 11.5px; color: var(--dim); font-weight: 600; }
#r-list { flex: 1; min-height: 0; padding: 0 8px 8px; }
.row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 8px; font-size: 13px; white-space: nowrap; border-bottom: 1px solid rgba(255,255,255,.05); }
.row.ind { padding-left: 34px; } .row.per { font-weight: 600; margin-top: 3px; } .row.sel { background: rgba(255,255,255,.13); }
.row.hd { font-weight: 600; padding-left: 20px; overflow: hidden; } .row.hd span { overflow: hidden; text-overflow: ellipsis; }
.row.grp { font-weight: 600; padding-left: 4px; gap: 7px; } .row.grp small { margin-left: auto; font-size: 11px; color: var(--dim); font-weight: 400; } .row.grp .chev { color: var(--dim); }
.gbody .row { padding-left: 24px; } .gbody .row.ind { padding-left: 38px; } .gbody .row.hd { padding-left: 22px; } .gbody .addrow { margin-left: 24px; width: calc(100% - 30px); }
.row em { margin-left: auto; font: 700 10.5px var(--ui); color: var(--live); font-style: normal; }
.st { width: 14px; height: 14px; flex: none; display: grid; place-items: center; }
.st.pend::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 1.3px solid #A7A8AF; box-sizing: border-box; }
.st.live::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--live); animation: vg-blink 1.4s ease-in-out infinite; }
.st.done { color: var(--ok); }
@keyframes vg-blink { 50% { opacity: .45; } }
.addrow { display: flex; align-items: center; gap: 8px; width: calc(100% - 26px); margin: 3px 6px 3px 20px; height: 28px; border: 1px dashed #6F7079; border-radius: 7px; background: none; font-size: 13px; color: var(--dim); padding: 0 12px; white-space: nowrap; }
.addrow svg { color: var(--mac); }
.vg-side .foot { flex: none; border-top: 1px solid var(--hair); padding: 9px 10px; display: flex; justify-content: flex-end; }
/* Colonne principale */
.vg-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.vg-bar { height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 8px; }
.vg-bar .lights { margin: 0 6px 0 12px; }
.vg-seg { display: flex; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.05); border-radius: 99px; padding: 3px; height: 36px; box-sizing: border-box; }
.vg-seg button { border: 0; background: none; padding: 0 16px; border-radius: 99px; font-size: 13.5px; }
.vg-seg .on { background: rgba(255,255,255,.14); }
.vg-ttl { font-weight: 700; font-size: 13.5px; } .vg-ttl small { display: block; font-weight: 400; font-size: 11px; color: var(--dim); }
.vg-tools { margin-left: auto; display: flex; gap: 8px; position: relative; }
.b { border: 0; background: var(--ctl); border-radius: 6px; padding: 4px 9px; font-size: 12px; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; height: 22px; box-sizing: border-box; }
.b.pri { background: var(--mac); color: #fff; } .b:disabled { opacity: .4; }
.vg-menu { position: absolute; z-index: 30; background: #2F3037; border: 1px solid rgba(255,255,255,.18); border-radius: 10px; padding: 5px; box-shadow: 0 14px 40px rgba(0,0,0,.6); animation: vg-pop .18s ease-out both; }
.vg-menu small { display: block; padding: 3px 10px; color: var(--dim); font-size: 11px; font-weight: 600; }
.vg-menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 4px 10px; border-radius: 6px; font-size: 13px; white-space: nowrap; }
.vg-menu button:hover { background: var(--mac); } .vg-menu button:disabled { opacity: .4; }
.vg-menu hr { border: 0; border-top: 1px solid var(--hair); margin: 4px 8px; }
@keyframes vg-pop { from { opacity: 0; transform: translateY(-4px) scale(.97); } }
.vg-menu.sortie { right: 132px; top: 40px; }
.vg-center { flex: 1; min-height: 0; padding: 8px 20px 12px; display: flex; flex-direction: column; gap: 16px; position: relative; }
/* Carte des chronos */
.clock { height: 80px; flex: none; display: flex; align-items: center; background: rgba(0,0,0,.28); border: 1px solid var(--hair); border-radius: 12px; padding: 0 16px; box-sizing: border-box; }
.clock .z { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; } .clock .z > div { display: flex; gap: 5px; align-items: center; }
.clock .lab { font-size: 12px; font-weight: 600; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock .sep { width: 1px; height: 52px; background: var(--hair); margin: 0 12px; flex: none; }
.clock .b { font-size: 11px; padding: 3px 7px; }
#vg-clk { font: 700 27px var(--mono); width: 92px; } #vg-clk.warn { color: #FFD60A; } #vg-clk.crit { color: var(--live); }
.ic2 { font: 600 20px var(--mono); width: 140px; white-space: nowrap; }
.alert { background: #FFD60A !important; color: #000; font-weight: 600; animation: vg-pop .25s ease-out both; }
.scz { width: 220px; flex: none; display: flex; flex-direction: column; gap: 5px; }
.scz div { display: flex; align-items: center; gap: 8px; } .scz .nm { flex: 1; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.scz .d { display: flex; gap: 3px; } .scz .d i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.22); } .scz .d i.on { background: #FFD60A; }
.scz .n { font: 700 20px ui-rounded, var(--ui); width: 28px; text-align: center; font-variant-numeric: tabular-nums; display: inline-block; }
.scz .n.bump { animation: vg-bump .6s cubic-bezier(.2,.8,.2,1); }
@keyframes vg-bump { 30% { transform: scale(1.7); color: var(--accent); } }
.scz .pm { color: var(--dim); } .hist { color: var(--dim); margin-left: 10px; }
/* Aperçus */
.prev { display: flex; align-items: center; gap: 10px; flex: none; }
.pv { flex: 1; min-width: 0; } .pv h5 { margin: 0 0 6px; font-size: 14px; font-weight: 700; height: 18px; display: flex; gap: 8px; align-items: center; }
.pv h5 span { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }
.pvs { position: relative; width: 440px; height: 248px; overflow: hidden; background: #0A1A2C; border-radius: 4px; --ps: .34375; }
.pvf { position: absolute; inset: 0; border-radius: 4px; pointer-events: none; z-index: 5; }
.pv.prep .pvf { border: 2px dashed #FFD60A; } .pv.air .pvf { border: 2px solid var(--live); }
.pv.air.flash .pvf { animation: vg-flash .7s ease-out; }
@keyframes vg-flash { 0% { box-shadow: 0 0 0 0 rgba(255,90,95,.9), inset 0 0 40px rgba(255,90,95,.6); } 100% { box-shadow: 0 0 0 16px rgba(255,90,95,0); } }
.blk { position: absolute; inset: 0; background: #0B0D11; z-index: 4; opacity: 0; transition: opacity .6s; pointer-events: none; } .blk.on { opacity: 1; }
.pcol { width: 64px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; padding-top: 20px; }
.pcol b { font-weight: 600; }
.pcol .go { width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgba(255,255,255,.13); color: #fff; display: grid; place-items: center; }
.pcol .go:disabled { opacity: .35; }
.pcol .go.fire { animation: vg-fire .5s ease-out; } @keyframes vg-fire { 40% { transform: scale(1.25); box-shadow: 0 0 0 10px rgba(10,129,124,.3); } }
.pcol .nb { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--ctl); margin-top: 10px; display: grid; place-items: center; }
.pcol small { color: var(--dim); font-size: 10px; }
/* Centre : outils de l'étape */
.work { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.work > * { flex: none; }
.rail { display: flex; align-items: center; gap: 8px; font-size: 14px; } .rail b { margin-right: 6px; }
.rail span { padding: 4px 12px; border-radius: 99px; border: 1px solid #77787F; display: inline-flex; gap: 6px; align-items: center; }
.rail span.opt { border-style: dashed; } .rail span.on { border-color: var(--mac); background: rgba(10,129,124,.3); } .rail u { color: #77787F; text-decoration: none; display: flex; }
.rail .st.live::before { width: 9px; height: 9px; }
.hl { margin: 0; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; padding-left: 12px; } .h2 { margin: 0; font-size: 17px; font-weight: 700; }
.box { background: rgba(255,255,255,.045); border-radius: 10px; padding: 10px 12px; }
.muted { color: var(--dim); }
.sum { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.055); border-radius: 10px; padding: 10px 12px; } .sum div { flex: 1; min-width: 0; } .sum b { font-size: 15.5px; font-weight: 600; display: block; margin-bottom: 3px; }
.b.lg { height: 26px; padding: 0 11px; font-size: 13px; gap: 7px; }
.grp { width: 700px; align-self: center; background: rgba(255,255,255,.045); border-radius: 10px; padding: 0 10px; box-sizing: border-box; }
.grp > div { min-height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--hair); } .grp > div:first-child { border-top: 0; }
.grp .r { display: flex; align-items: center; gap: 8px; } .grp .quick { justify-content: flex-end; border-top: 0; min-height: 30px; padding-bottom: 6px; }
#vg-title { flex: 1; background: none; border: 0; color: inherit; font: inherit; text-align: right; padding: 4px 0; outline: none; caret-color: var(--mac); } #vg-title::placeholder { color: #77787F; }
.seg2 { display: flex; border-radius: 6px; overflow: hidden; background: var(--ctl); } .seg2 span { padding: 3px 14px; } .seg2 .on { background: var(--mac); }
.pm2 { width: 46px; height: 22px; border-radius: 6px; background: var(--ctl); display: grid; place-items: center; color: var(--soft); } .pm2.off { opacity: .35; }
.val { width: 64px; text-align: center; font: 600 14px ui-rounded, var(--ui); color: var(--soft); }
.b.q { height: 22px; padding: 0 10px; } .b.q.on { color: var(--mac); }
.cb { width: 14px; height: 14px; border-radius: 4px; background: var(--mac); display: inline-grid; place-items: center; font-size: 10px; } .cb.off { background: rgba(255,255,255,.14); }
.plays { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; } .plays > div { display: grid; gap: 4px; align-content: start; } .plays h6 { margin: 0 0 2px; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; } .plays h6 small { font-weight: 400; color: var(--dim); font-size: 11.5px; }
.plb { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 2px 0; text-align: left; font-size: 13px; border-radius: 6px; } .plb:disabled { cursor: default; } .plb:not(:disabled):hover { background: rgba(255,255,255,.06); }
.plays u { text-decoration: none; font-size: 9.5px; font-weight: 700; background: rgba(255,255,255,.16); border-radius: 99px; padding: 0 5px; }
.fouls { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; position: relative; } .fouls h6 { font-size: 13.5px; font-weight: 700; margin: 0 0 6px; display: flex; align-items: center; justify-content: space-between; min-height: 22px; }
.fouls .l { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.fb { border: 0; background: var(--ctl); border-radius: 6px; height: 24px; padding: 0 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.pfoul { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.07); border-radius: 6px; padding: 4px 8px; margin-bottom: 4px; } .pfoul i { width: 10px; height: 10px; border-radius: 50%; } .pfoul span { flex: 1; }
.fouls ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; } .fouls li { display: flex; gap: 8px; align-items: center; } .fouls li i { width: 9px; height: 9px; border-radius: 50%; } .fouls li b { color: #FFD60A; font-size: 11px; }
.vg-menu.types { left: 0; top: 58px; min-width: 210px; }
.res { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.res button { border: 0; border-radius: 8px; height: 56px; font-size: 16px; font-weight: 600; color: #fff; transition: transform .15s, filter .15s; filter: saturate(.8) brightness(.82); } .res button:hover { transform: translateY(-2px); filter: none; }
.tog { display: flex; gap: 12px; align-items: center; justify-content: space-between; } .tog i { width: 36px; height: 20px; border-radius: 10px; background: #55565E; position: relative; flex: none; } .tog i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: #F4F5F7; color: #0E1116; font-weight: 600; padding: 8px 16px; border-radius: 99px; z-index: 40; animation: vg-up .3s ease-out both; white-space: nowrap; }

/* Centre du board : fil d'étapes, puis trois tuiles fixes (Carte · étape en préparation · Joueurs en jeu) */
:root { --tq: #0A817C; }

function fd(from, to, delay) {
  const go = from != null && from !== to;
  return `<span class="fd" style="--fdl:${delay || .7}s"><b class="t1"><i>${to}</i></b><b class="b1"><i>${go ? from : to}</i></b>${go ? `<b class="t2"><i>${from}</i></b><b class="b2"><i>${to}</i></b>` : ''}</span>`;
}
// Score à deux chiffres, comme les volets de l'app
function fd2(from, to, delay) {
  const p = n => String(n).padStart(2, '0'), a = p(from == null ? to : from), b = p(to);
  return `<span style="white-space:nowrap">${fd(+a[0], +b[0], delay)}${fd(+a[1], +b[1], delay)}</span>`;
}

function see(el) {
  const c = el && el.closest('.vg-scroll'); if (!c || !c.clientHeight) return;
  const k = c.getBoundingClientRect().height / c.clientHeight || 1;
  const top = (el.getBoundingClientRect().top - c.getBoundingClientRect().top) / k + c.scrollTop;
  c.scrollTo({ top: Math.max(0, top - c.clientHeight / 2 + el.offsetHeight / 2), behavior: quiet ? 'auto' : 'smooth' });
}

// ---------- Moteur ----------
// Chaque étape : soit on fait le geste soi-même (clic sur l'élément entouré), soit on clique sur Suivant,
// et un curseur fait le geste à notre place. Dans les deux cas, on passe ensuite à l'étape suivante.
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
const later = (f, ms) => timers.push(setTimeout(f, ms));
function toast(t) { if (quiet) return; const e = $('#vg-toast'); e.innerHTML = `<div class="toast">${esc(t)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => { e.innerHTML = ''; }, 2200); }
function runStep(s) { for (let i = 0; i < 4; i++) { s.do && s.do(s.demo); if (!s.done || s.done()) break; } }
let busy = false, note = '';
function go(n) {
  clearTimers(); busy = false; quiet = true; S = init(); ie = 0; $('#vg-ghost').hidden = true;
  for (let i = 0; i < n; i++) { const s = STEPS[i]; s.en && s.en(); runStep(s); s.lv && s.lv(); }
  cur = n; note = n > 0 ? STEPS[n - 1].af || '' : ''; STEPS[n].en && STEPS[n].en(); done = !!STEPS[n].info;
  render(); quiet = false; coach(); store();
}
function advance() {
  if (cur >= STEPS.length - 1) return;
  clearTimers(); busy = false; $('#vg-ghost').hidden = true;
  const s = STEPS[cur]; s.lv && s.lv(); note = s.af || '';
  cur++; STEPS[cur].en && STEPS[cur].en(); done = !!STEPS[cur].info; render(); coach(); store();
}
function next() {
  const s = STEPS[cur];
  if (s.end) { if (inApp) { try { localStorage.removeItem('impromatch-visite'); } catch (e) {} window.webkit.messageHandlers.tour.postMessage('close'); } else go(0); return; }
  if (done) { advance(); return; }
  if (!busy) showMe();
}
function store() { try { localStorage.setItem('impromatch-visite', String(cur)); } catch (e) {} }
// Le geste de l'étape vient d'être fait : on montre le résultat un instant, puis on avance
function finish() {
  done = true; coach(true);
  if (STEPS[cur].manual) return;
  busy = true; later(advance, STEPS[cur].wait || 1100);
}
function nudge() { const r = $('#vg-ring'); r.classList.remove('no'); void r.offsetWidth; r.classList.add('no'); }
function act(a, v) {
  const s = STEPS[cur];
  if (a === 'siren') { siren(); return; }
  if (a === 'tab') { S.tab = v; render(); return; }
  if (a === 'sch') { S.sk = +v; S.play = false; render(); return; }
  if (a === 'schplay') { S.play = !S.play; render(); return; }
  if (a === 'title' && s.ex === 'title') { if (busy) return; s.do(v); render(); const ok = !!s.done(); if (ok !== done) { done = ok; coach(true); } return; }
  if (busy || done || s.ex !== a || (s.ok && !s.ok(v))) { nudge(); return; }
  s.do(v); render();
  if (a === 'project') { const g = $('.pcol .go'); if (g) { g.classList.remove('fire'); void g.offsetWidth; g.classList.add('fire'); } }
  if (!s.done || s.done()) finish();
}
function coach(keep) {
  const s = STEPS[cur], c = $('#vg-copy');
  const ids = STEPS.map((q, i) => i).filter(i => STEPS[i].ch === s.ch);
  const lst = v => Array.isArray(v) ? (v.length > 1 ? `<ul>${v.map(i => `<li>${i}</li>`).join('')}</ul>` : `<span>${v[0]}</span>`) : `<span>${v}</span>`;
  let body = note ? `<div class="vg-ok">${lst(note)}</div>` : '';
  if (s.logo) body += `<div class="vg-logo">${LOGO}</div>`;
  body += `<div class="vg-x">${lst(s.x)}</div>`;
  if (s.chips) body += `<div class="vg-chips">${s.chips.map(t => `<button type="button" data-chip="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
  if (s.save) body += `<div><button type="button" class="vg-btn" id="vg-save">Enregistrer le match</button></div>`;
  if (s.short) body += `<dl class="vg-short">${s.short.map(([k, l]) => `<dt><kbd>${k}</kbd></dt><dd>${l}</dd>`).join('')}</dl>`;
  if (!s.info) body += done
    ? `<p class="vg-hint ok">✓ <span>C'est fait.${s.manual ? ' Cliquez sur <b>Suivant</b>.' : ''}</span></p>`
    : `<p class="vg-hint">${ic('arrow-right', 14, 2)}<span>À vous : ${s.ex === 'title' ? 'tapez dans le champ entouré de jaune' : 'cliquez sur l\'élément entouré de jaune'}${s.keys ? ` (ou <kbd>${s.keys}</kbd>)` : ''}. Ou cliquez sur <b>Suivant</b> pour voir le geste.</span></p>`;
  c.innerHTML = `<p class="vg-eye">Chapitre ${s.ch + 1} sur ${CH.length}</p><h1>${CH[s.ch]}</h1><ol class="vg-steps">`
    + ids.map((i, k) => { const q = STEPS[i], st = i < cur ? 'done' : i === cur ? 'cur' : 'todo';
      return `<li class="${st}"><button type="button" data-go="${i}"><span class="n">${i < cur ? '✓' : k + 1}</span><span>${q.t}</span></button>${i === cur ? `<div class="vg-body" ${keep ? 'style="animation:none"' : ''}>${body}</div>` : ''}</li>`; }).join('') + '</ol>';
  const nx = $('#vg-next'), bk = $('#vg-back');
  bk.hidden = cur === 0;
  nx.textContent = s.end ? (inApp ? 'Essayer maintenant' : 'Recommencer la visite') : (s.next || 'Suivant →');
  nx.classList.toggle('pulse', done && !!s.manual);
  $('#vg-prog').innerHTML = CH.map((n, i) => {
    const all = STEPS.filter(q => q.ch === i).length, before = STEPS.slice(0, cur + (done ? 1 : 0)).filter(q => q.ch === i).length;
    return `<button type="button" data-ch="${i}" class="${i === s.ch ? 'cur' : i < s.ch ? 'past' : ''}" aria-label="Chapitre ${i + 1} : ${n}"><span>${i + 1} · ${n}</span><i><b style="width:${100 * before / all}%"></b></i></button>`;
  }).join('');
  const li = c.querySelector('.vg-steps .cur'); if (li && !keep) c.scrollTop = li.offsetTop + li.offsetHeight <= c.clientHeight ? 0 : Math.max(0, li.offsetTop - 8);
  requestAnimationFrame(cam);
}

// Caméra : sur grand écran le board entier ; sur petit écran, zoom sur la zone de l'étape
function cam() {
  const view = $('#vg-view'), stage = $('#vg-stage'), v = view.getBoundingClientRect(), W = 1240, H = 880;
  if (!v.width) return;
  const fit = Math.min(v.width / W, v.height / H);
  let sc = fit, tx = (v.width - W * sc) / 2, ty = (v.height - H * sc) / 2;
  const f = STEPS[cur].foc, el = f && v.width < 700 ? stage.querySelector(f) : null;
  if (el) {
    const sr = stage.getBoundingClientRect(), k = sr.width / W, r = el.getBoundingClientRect();
    if (r.width) {
      const x = (r.left - sr.left) / k, y = (r.top - sr.top) / k, w = r.width / k, h = r.height / k;
      sc = Math.max(fit, Math.min(v.width / Math.min(w + 20, f === '#r-prev' ? 960 : 620), v.height / (h + 20), 1.1));
      const cl = (t, size, span) => size * sc <= span ? (span - size * sc) / 2 : Math.min(0, Math.max(span - size * sc, t));
      let fx = x + w / 2, fy = y + h / 2; const tgt = STEPS[cur].tg && stage.querySelector(STEPS[cur].tg);
      if (tgt) { const t = tgt.getBoundingClientRect(); if (w * sc > v.width) fx = (t.left + t.width / 2 - sr.left) / k; if (h * sc > v.height) fy = (t.top + t.height / 2 - sr.top) / k; }
      tx = cl(v.width / 2 - fx * sc, W, v.width); ty = cl(v.height / 2 - fy * sc, H, v.height);
    }
  }
  stage.style.transform = `translate(${tx}px,${ty}px) scale(${sc})`;
}
// Anneau sur la cible de l'étape
function ring() {
  const r = $('#vg-ring'), s = STEPS[cur], el = !done && s.tg ? $(s.tg) : null;
  let show = false;
  if (el) {
    const b = el.getBoundingClientRect(), sc = el.closest('.vg-scroll'), box = (el.closest('.vg-coach') ? document.body : sc || $('#vg-view')).getBoundingClientRect();
    const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    if (b.width && cx > box.left && cx < box.right && cy > box.top && cy < box.bottom) {
      show = true; r.style.left = b.left - 5 + 'px'; r.style.top = b.top - 5 + 'px'; r.style.width = b.width + 6 + 'px'; r.style.height = b.height + 6 + 'px';
    }
  }
  r.hidden = !show;
  requestAnimationFrame(ring);
}
// Suivant sur une étape à geste : un curseur part du bouton et fait le geste, puis on avance
function showMe() {
  const s = STEPS[cur]; if (done || s.info) return;
  const el = $(s.ds ? s.tg + ' ' + s.ds : s.tg) || $(s.tg);
  if (!el) { runStep(s); render(); finish(); return; }
  busy = true;
  const g = $('#vg-ghost'), from = $('#vg-next').getBoundingClientRect(), to = el.getBoundingClientRect();
  g.hidden = false; g.classList.remove('tap'); g.style.transition = 'none'; g.style.left = from.left + from.width / 2 + 'px'; g.style.top = from.top + 'px';
  void g.getBoundingClientRect(); g.style.transition = ''; g.style.left = to.left + to.width / 2 + 'px'; g.style.top = to.top + to.height / 2 + 'px';
  const tap = () => {
    if (STEPS[cur] !== s) return;
    g.classList.remove('tap'); void g.getBoundingClientRect(); g.classList.add('tap');
    if (s.ex === 'title') {
      const t = s.demo; let i = 0;
      const ty = () => { if (STEPS[cur] !== s) return; i++; const inp = $('#vg-title'); if (inp) inp.value = t.slice(0, i); s.do(t.slice(0, i)); render();
        if (i < t.length) later(ty, 45); else { g.hidden = true; done = true; coach(true); later(advance, 900); } };
      ty(); return;
    }
    busy = false; act(s.ex, el.dataset.v || s.demo);
    if (!done && STEPS[cur] === s) { busy = true; later(tap, 700); } else later(() => { g.hidden = true; }, 450);
  };
  later(tap, 650);
}
// Sirène : deux montées, synthétisées
function siren() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext; siren.c = siren.c || new AC();
    const c = siren.c, o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
    o.type = 'sawtooth'; o.frequency.setValueAtTime(420, t); o.frequency.linearRampToValueAtTime(900, t + .45); o.frequency.linearRampToValueAtTime(420, t + .9); o.frequency.linearRampToValueAtTime(900, t + 1.35); o.frequency.linearRampToValueAtTime(380, t + 1.8);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .05); g.gain.setValueAtTime(.12, t + 1.6); g.gain.linearRampToValueAtTime(0, t + 1.8);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + 1.85);
  } catch (e) {}
  toast('Sirène');
}

// ---------- Événements ----------
$('#vg-stage').addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && !b.disabled) act(b.dataset.a, b.dataset.v); });
$('#vg-stage').addEventListener('input', e => { if (e.target.id === 'vg-title') act('title', e.target.value); });
$('#vg-copy').addEventListener('click', e => {
  const c = e.target.closest('[data-chip]'); if (c) { const i = $('#vg-title'); if (i) i.value = c.dataset.chip; act('title', c.dataset.chip); }
  if (e.target.closest('#vg-save')) act('save');
  const g = e.target.closest('[data-go]'); if (g && +g.dataset.go !== cur) go(+g.dataset.go);
});
$('#vg-prog').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) go(STEPS.findIndex(s => s.ch === +b.dataset.ch)); });
$('#vg-back').addEventListener('click', () => go(Math.max(0, cur - 1)));
$('#vg-next').addEventListener('click', next);
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase(), typing = e.target.tagName === 'INPUT';
  if (mod && k === 'enter') { e.preventDefault(); act('project'); }
  else if (mod && k === 'b') { e.preventDefault(); act('black'); }
  else if (mod && k === 's') { e.preventDefault(); act('save'); }
  else if (!mod && !e.altKey && ((k === 'enter' && e.target.tagName !== 'BUTTON') || (k === 'arrowright' && !typing))) { e.preventDefault(); next(); }
  else if (!mod && !e.altKey && k === 'arrowleft' && !typing) { e.preventDefault(); if (cur > 0) go(cur - 1); }
});
window.addEventListener('resize', cam);
if (window.ResizeObserver) new ResizeObserver(cam).observe($('#vg-view'));

window.impromatchVisite = { act };
let start = 0;
try { start = Math.min(STEPS.length - 2, Math.max(0, parseInt(localStorage.getItem('impromatch-visite'), 10) || 0)); } catch (e) {}
go(start);
requestAnimationFrame(ring);
})();
</script>
